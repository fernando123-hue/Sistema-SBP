name: CodeQL

# DESARMADO DE PROPÓSITO — só roda por acionamento manual.
#
# A análise funciona (varreu os 35 arquivos TypeScript sem erro), mas o UPLOAD
# do resultado exige "code scanning", que o GitHub só oferece em repositório
# público ou com Advanced Security. Neste repositório privado no plano free, o
# passo final falha sempre — e um workflow eternamente vermelho ensina a equipe
# a ignorar vermelho, que é pior do que não ter o workflow.
#
# PARA REATIVAR quando o repositório for público ou o plano permitir:
# descomente os gatilhos abaixo. Nada mais precisa mudar.
#
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#   schedule:
#     # Segunda-feira, 06:00 UTC. Pega CVE nova em código que ninguém tocou.
#     - cron: '0 6 * * 1'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisar:
    name: Análise estática de segurança
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      # `persist-credentials: false`: nenhum passo destes jobs empurra nada, e
      # deixar o token do CI escrito no `.git/config` do executor o entrega a
      # qualquer script de dependência que resolva lê-lo (achado N-20).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
