name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Menor privilégio por padrão. Jobs que precisam de mais declaram localmente.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Typecheck, testes e migrações
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # O banco é MySQL (`A42`), e a suíte roda NELE — testar em banco diferente
    # do de produção esconde a classe de erro que só aparece com dado real
    # (`AT-30`). O serviço nasce e morre com o job.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

    env:
      DATABASE_URL: mysql://root@127.0.0.1:3306/sbp_teste
      # Base sombra do Prisma. Em MySQL, `migrate diff --from-migrations`
      # precisa de um banco onde aplicar as migrações para comparar — em SQLite
      # ele usava um arquivo temporário e ninguém precisava saber disso.
      SHADOW_DATABASE_URL: mysql://root@127.0.0.1:3306/sbp_sombra
      NODE_ENV: test
      # ═══ POR QUE ISTO NÃO É SEGREDO, E POR QUE PRECISA ESTAR AQUI ═══
      #
      # `SESSAO_SECRET` virou obrigatório quando "sair" passou a revogar sessão
      # de verdade, e `ambiente()` recusa subir sem ele. Localmente o valor vem
      # do `.env`, que não existe no CI — então TODO teste que toca o banco
      # morria em "SESSAO_SECRET: Invalid input", e o CI ficou vermelho por
      # quatro execuções seguidas sem ninguém notar, enquanto o `ESTADO.md`
      # dizia "494 verdes".
      #
      # O valor é público de propósito: assina cookies de um banco efêmero que
      # nasce e morre dentro do job. Pôr um segredo de verdade aqui seria pior —
      # daria a impressão de que existe algo a proteger num ambiente onde não há.
      SESSAO_SECRET: ci-nao-e-segredo-so-para-o-banco-efemero
      # Mesmo raciocínio para o segredo do CPF protegido (A23(b)): obrigatório
      # para subir, e aqui só protege CPF sintético de um banco efêmero.
      BUSCA_SECRET: ci-nao-e-segredo-so-para-cpf-sintetico

    steps:
      # `persist-credentials: false`: nenhum passo destes jobs empurra nada, e
      # deixar o token do CI escrito no `.git/config` do executor o entrega a
      # qualquer script de dependência que resolva lê-lo (achado N-20).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npx prisma generate

      # A COLAÇÃO NÃO É DETALHE, e por isso a base é criada à mão em vez de por
      # `MYSQL_DATABASE`: com o padrão do MySQL 8, que ignora maiúsculas e
      # acentos, duas grafias da mesma liga colidem no índice único de `Liga` e
      # viram a mesma linha — o contrário do que `AT-10` garante, sem erro que
      # denuncie. O CI precisa reproduzir a base da implantação, não uma parecida.
      - name: Criar as bases de teste com a colação da implantação
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -e "
            CREATE DATABASE sbp_teste CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_as_cs;
            CREATE DATABASE sbp_sombra CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_as_cs;"

      # Pega o caso clássico: alguém edita o schema e esquece de gerar a
      # migração. `--exit-code` devolve 2 quando há diferença, quebrando o build.
      - name: Verificar que o schema e as migrações estão em sincronia
        # A base sombra é declarada em `prisma.config.ts`, que lê
        # `SHADOW_DATABASE_URL` do ambiente — `migrate diff` NÃO aceita
        # `--shadow-database-url`, e tentar passar por aqui derruba o passo com
        # erro de uso.
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      # `tsc --noEmit` não é o mesmo que `next build`. O build valida a fronteira
      # servidor/cliente, os tipos de rota gerados em `.next/types` (que num
      # checkout limpo NÃO existem, então o typecheck do CI nem os enxerga) e a
      # serialização de props entre Server e Client Components. Sem este passo,
      # mover uma função para um componente `'use client'` entrava verde na main
      # e só falhava quando o operador fosse publicar — o pior momento possível.
      - name: Build de produção
        run: npm run build

  segredos:
    name: Varredura de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PRs do Dependabot recebem token somente-leitura, então o gitleaks falha
    # com "Resource not accessible by integration" — vermelho que não é defeito
    # e ensina a ignorar vermelho. Dependabot só mexe em manifesto de
    # dependência; segredo novo não entra por aí.
    if: github.actor != 'dependabot[bot]'

    # Em pull request, o gitleaks lista os commits do PR pela API
    # (`/pulls/{n}/commits`) para varrer só o que mudou. Com o padrão do
    # workflow (`contents: read`), essa chamada volta 403 e o job falha SEM
    # ter encontrado segredo nenhum — de novo o vermelho que não é defeito,
    # agora no PR comum e não só no do Dependabot. Leitura de PR é o mínimo
    # que resolve; o restante do menor privilégio continua de pé.
    permissions:
      contents: read
      pull-requests: read

    steps:
      # `persist-credentials: false`: nenhum passo destes jobs empurra nada, e
      # deixar o token do CI escrito no `.git/config` do executor o entrega a
      # qualquer script de dependência que resolva lê-lo (achado N-20).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencias:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `persist-credentials: false`: nenhum passo destes jobs empurra nada, e
      # deixar o token do CI escrito no `.git/config` do executor o entrega a
      # qualquer script de dependência que resolva lê-lo (achado N-20).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # `--ignore-scripts`: este job existe para AUDITAR as dependências, e
      # auditar não exige executá-las. Um pacote comprometido roda o script de
      # instalação antes de qualquer verificação — o job que deveria acusar a
      # cadeia de suprimentos seria o primeiro a executá-la (achado N-20).
      - run: npm ci --ignore-scripts

      # Falha só em vulnerabilidade alta ou crítica — ruído baixo não trava PR.
      - name: npm audit
        run: npm audit --audit-level=high
