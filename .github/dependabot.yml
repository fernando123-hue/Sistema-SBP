version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Agrupa patches para não gerar enxurrada de PR por semana.
      patches:
        update-types: [patch]
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # `init` e `analyze` do CodeQL compartilham estado e precisam estar na
      # mesma versão; em PRs separados, mesclar um só deixava a main com as
      # duas misturadas (#173 e #174). Só elas: agrupar tudo juntaria uma
      # versão major de outra ação num PR que ninguém lê com atenção
      # (revisão de segurança do #180).
      codeql:
        patterns: ['github/codeql-action*']
